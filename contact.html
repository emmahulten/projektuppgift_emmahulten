<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Momo+Trust+Sans:wght@200..800&display=swap"
        rel="stylesheet">

    <link rel="Stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
    <script src="js/contact.js" defer></script>
    <title>Frankie's</title>
</head>

<body>
    <header>
        <!-- Logotyp men inbyggd länk till startsida-->
        <a href="index.html" class="logo">
            <img src="images/frankies_logo.png" alt="logotyp">
        </a>

        <!-- Navigation/Meny -->
        <button class="menu-toggle">☰</button>
        <nav class="menu">
            <ul>
                <li><a href="index.html">Start</a></li>
                <li><a href="menu.html">Sips&Snacks</a></li>
                <li><a href="event.html">Event</a></li>
                <li><a href="merch.html">Stuff</a></li>
                <li><a href="contact.html">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!--Huvudinnehåll: Kontaktsida- kontaktformulär och länk till email-->
        <p id="confirmation"></p>
        <section class="contact-form">
            <h1>Kontakt</h1>
        

            <form id="contactForm">
                <label for="name">Ditt namn:</label>
                <input type="text" id="name" name="name">
                <p id="nameError" class="error-message"></p>

                <label for="email">E-post:</label>
                <input type="email" id="email" name="email" placeholder="name@example.com">
                <p id="emailError" class="error-message"></p>

                <label for="phone">Telefon:</label>
                <input type="tel" id="phone" name="phone" placeholder="Ex. 070-174 06 12">
                <p id="phoneError" class="error-message"></p>

                <label for="subject">Ämne:</label>
                <select id="subject" name="subject">
                    <option value="">Välj ämne</option>
                    <option value="table">Boka bord</option>
                    <option value="room">Boka rum</option>
                    <option value="other">Allmän fråga</option>
                </select>

                <p id="subjectError" class="error-message"></p>

                <label for="message">Meddelande:</label>
                <textarea id="message" name="message"></textarea>
                <p id="messageError" class="error-message"></p>

                <button type="submit" class="button">Skicka</button>
            </form>
        </section>
    </main>

    <footer>
        <img src="images/frankies_logo.png" alt="logotyp">

        <div class="opening-hours">
            <h2>Öppettider</h2>
            <dl>
                <dt>Måndag</dt>
                <dl>Stängt</dl>

                <dl>Tisdag-Torsdag</dl>
                <dt>16:00-23:00</dt>

                <dl>Fredag</dl>
                <dt>16:00-02:00</dt>

                <dl>Lördag</dl>
                <dt>14:00-02:00</dt>

                <dl>Söndag</dl>
                <dt>14:00-22:00</dt>
            </dl>
        </div>
        <div class="adress">
            <h2>Hitta hit</h2>
            <p>
                Hittepågatan 12<br>
                852 36 Sundsvall
            </p>
            <a href="tel:+46701740612">Tel: 070-174 06 12</a>
            <br>
            <a href="mailto:hello@frankies.example">hello@frankies.example</a>
        </div>
    </footer>
</body>

</html>
